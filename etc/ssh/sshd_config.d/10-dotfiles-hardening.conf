# Managed by dotfiles → installed to /etc/ssh/sshd_config.d/ by the installer.
# Key-only SSH (accessed over the Tailscale network). Drop-in overrides; the
# main sshd_config Include picks this up on both Linux and macOS.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
