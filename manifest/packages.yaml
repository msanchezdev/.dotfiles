# Shared package manifest — installed on every device.
#
# BARE: no packages are installed. Uncomment entries below (or add your own)
# as you rebuild your setup from scratch.
#
# Each entry:
#   via:   installer (brew | bun | npm | apt | git)   [required]
#   name:  package name / id passed to the installer  [required]
#   bin:   command used to detect "already installed"  [optional, fast skip]
#   only:  [linux, macos] platform gate                [optional, default all]
#   repo / dest: for via: git                          [required for git]
#   tags:  free-form grouping for humans               [optional]
packages:
  # neovim (config in nvim/.config/nvim bootstraps lazy.nvim; plugins added over time)
  - { via: brew, name: neovim, bin: nvim, tags: [core, nvim] }
  # telescope runtime deps: ripgrep (live_grep), fd (find_files)
  - { via: brew, name: ripgrep, bin: rg, tags: [nvim] }
  - { via: brew, name: fd,      bin: fd, tags: [nvim] }
  # C compiler for nvim-treesitter parser builds (macOS uses the Xcode CLT)
  - { via: apt, name: build-essential, bin: gcc, only: [linux], tags: [nvim] }
  # tree-sitter CLI — nvim-treesitter (main branch) needs it to install parsers.
  # (The `tree-sitter` formula is library-only; the CLI is `tree-sitter-cli`.)
  - { via: brew, name: tree-sitter-cli, bin: tree-sitter, tags: [nvim] }
  # LSP servers (enabled in nvim/.config/nvim/lua/plugins/lsp.lua)
  - { via: brew, name: lua-language-server, bin: lua-language-server, tags: [nvim, lsp] }      # lua_ls
  - { via: bun,  name: "@typescript/native-preview", bin: tsgo, tags: [nvim, lsp] }            # tsgo (ts/js)
  - { via: bun,  name: vscode-langservers-extracted, bin: vscode-json-language-server, tags: [nvim, lsp] }  # jsonls
  - { via: bun,  name: yaml-language-server, bin: yaml-language-server, tags: [nvim, lsp] }    # yamlls

  # tmux + its plugin manager (config in tmux/.tmux.conf loads plugins via tpm)
  - { via: brew, name: tmux, bin: tmux, tags: [core] }
  - { via: git,  name: tpm,  repo: "https://github.com/tmux-plugins/tpm", dest: "~/.tmux/plugins/tpm", tags: [tmux] }

  # zsh framework (zsh/.zshrc sources $ZSH/oh-my-zsh.sh)
  - { via: git,  name: oh-my-zsh, repo: "https://github.com/ohmyzsh/ohmyzsh", dest: "~/.oh-my-zsh", tags: [zsh] }
  # fzf fuzzy finder; zsh/.zshrc loads its key bindings + completion via `fzf --zsh`
  - { via: brew, name: fzf, bin: fzf, tags: [core, zsh] }

  # claude code (native installer -> ~/.local/bin/claude; updates via `claude update`)
  - { via: script, name: claude, bin: claude, cmd: "curl -fsSL https://claude.ai/install.sh | bash", tags: [dev] }
  # github cli — `gh auth login` (pick SSH) registers this machine's key with GitHub
  - { via: brew, name: gh, bin: gh, tags: [dev, git] }
  # pencil.dev desktop — Linux AppImage -> ~/.local/bin/pencil-desktop, macOS .dmg -> /Applications
  - { via: script, name: pencil, bin: pencil-desktop, cmd: "bash $DOTFILES/scripts/install-pencil.sh", tags: [app] }
  # FUSE 2 — AppImages (pencil-desktop) need libfuse.so.2 at runtime. Ubuntu
  # 24.04 renamed libfuse2 -> libfuse2t64 and doesn't ship it by default.
  - { via: apt, name: libfuse2t64, only: [linux], tags: [app] }
  # nvm + Node.js LTS (nvm is loaded in zsh/.zshrc). bin: node skips when present.
  - { via: script, name: nodejs, bin: node, cmd: "bash $DOTFILES/scripts/install-node.sh", tags: [dev] }
  # portless — named .localhost dev URLs (proxy); env vars in zsh/.zshrc
  - { via: bun, name: portless, bin: portless, tags: [dev] }
  # surrealdb — `surreal` CLI/server.
  #   macOS: Homebrew tap (downloads the prebuilt darwin-universal binary).
  #   Linux: official prebuilt-binary installer — drops it in /usr/local/bin if
  #   writable, else ~/.surrealdb; symlink that onto PATH. (Passing an install
  #   dir to the script trips a shift bug, so we don't.)
  - { via: brew,   name: "surrealdb/tap/surreal", bin: surreal, only: [macos], tags: [dev, db] }
  - { via: script, name: surrealdb, bin: surreal, only: [linux], tags: [dev, db],
      cmd: "curl -sSf https://install.surrealdb.com | sh && { command -v surreal >/dev/null 2>&1 || { mkdir -p \"$HOME/.local/bin\" && ln -sf \"$HOME/.surrealdb/surreal\" \"$HOME/.local/bin/surreal\"; }; }" }
  # surrealist — SurrealDB GUI (macOS .dmg from GitHub releases, no cask)
  - { via: script, name: surrealist, only: [macos], tags: [app, db],
      cmd: "bash $DOTFILES/scripts/install-surrealist.sh" }

  # cli tools
  - { via: brew, name: zoxide,    bin: zoxide, tags: [core] }   # `z` smart cd; zsh/.zshrc inits it
  - { via: brew, name: git-delta, bin: delta,  tags: [git] }    # git pager; configured in git/.gitconfig
  - { via: brew, name: yazi,      bin: yazi,   tags: [cli] }    # file manager; `y` fn in zsh/.zshrc
  - { via: brew, name: btop,      bin: btop,   tags: [cli] }    # resource monitor
  - { via: brew, name: htop,      bin: htop,   tags: [cli] }    # process viewer

  # SSH server — Linux only (macOS has sshd built-in; enabled via Remote Login
  # in postinstall). Hardened to key-only in etc/ssh/sshd_config.d/, enabled in
  # postinstall. Reached over the Tailscale network.
  - { via: apt, name: openssh-server, only: [linux], tags: [ssh] }

  # google-chrome — per platform. macOS: cask. Linux (amd64 only; no arm64
  # build from Google): official .deb, which also wires up Google's apt repo
  # for future updates.
  - { via: cask,   name: google-chrome, only: [macos], tags: [app] }
  - { via: script, name: google-chrome, bin: google-chrome, only: [linux], tags: [app],
      cmd: "sudo apt-get update -qq && curl -fsSL -o /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -y /tmp/google-chrome.deb && rm -f /tmp/google-chrome.deb" }

  # Docker on macOS via Colima (free/OSS, no licensing). CLI-only: run
  # `colima start` to bring up the runtime (docker context is set automatically;
  # `colima start --profile <name>` for per-project/company VMs). On WSL you use
  # Docker Desktop on Windows instead. (Alternatives: cask 'orbstack' or 'docker-desktop'.)
  # Tailscale (macOS GUI app + system extension; includes the `tailscale` CLI).
  # On WSL you use Tailscale on Windows.
  - { via: cask, name: tailscale-app, only: [macos], tags: [app] }

  - { via: brew, name: colima,         bin: colima,         only: [macos], tags: [dev] }
  # Rosetta 2 — Apple Silicon only. Colima's seeded config uses `rosetta: true`
  # to run amd64 images; without it `colima start` hangs at SSH (FATAL[0601]).
  # Idempotent: skips on Intel and when Rosetta is already present.
  - { via: script, name: rosetta, only: [macos], tags: [dev],
      cmd: "[ \"$(uname -m)\" != arm64 ] || /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license" }
  - { via: brew, name: docker,         bin: docker,         only: [macos], tags: [dev] }  # docker CLI client
  - { via: brew, name: docker-compose, bin: docker-compose, only: [macos], tags: [dev] }
  - { via: brew, name: docker-buildx,                       only: [macos], tags: [dev] }

  # Xcode + iOS Simulator (macOS). `xcodes` manages Xcode versions; `aria2`
  # gives it faster parallel downloads. Installing Xcode itself needs your Apple
  # ID, so run `xcodes install --latest` yourself; postinstall then accepts the
  # license and fetches the iOS simulator runtime once Xcode is present.
  - { via: brew, name: xcodes, bin: xcodes, only: [macos], tags: [dev, ios] }
  - { via: brew, name: aria2,  bin: aria2c, only: [macos], tags: [dev, ios] }

