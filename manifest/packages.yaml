# Shared package manifest — installed on every device.
#
# BARE: no packages are installed. Uncomment entries below (or add your own)
# as you rebuild your setup from scratch.
#
# Each entry:
#   via:   installer (brew | bun | npm | apt | git)   [required]
#   name:  package name / id passed to the installer  [required]
#   bin:   command used to detect "already installed"  [optional, fast skip]
#   only:  [linux, macos] platform gate                [optional, default all]
#   repo / dest: for via: git                          [required for git]
#   tags:  free-form grouping for humans               [optional]
packages:
  # neovim (config in nvim/.config/nvim bootstraps lazy.nvim; plugins added over time)
  - { via: brew, name: neovim, bin: nvim, tags: [core, nvim] }
  # telescope runtime deps: ripgrep (live_grep), fd (find_files)
  - { via: brew, name: ripgrep, bin: rg, tags: [nvim] }
  - { via: brew, name: fd,      bin: fd, tags: [nvim] }

  # tmux + its plugin manager (config in tmux/.tmux.conf loads plugins via tpm)
  - { via: brew, name: tmux, bin: tmux, tags: [core] }
  - { via: git,  name: tpm,  repo: "https://github.com/tmux-plugins/tpm", dest: "~/.tmux/plugins/tpm", tags: [tmux] }

  # zsh framework (zsh/.zshrc sources $ZSH/oh-my-zsh.sh)
  - { via: git,  name: oh-my-zsh, repo: "https://github.com/ohmyzsh/ohmyzsh", dest: "~/.oh-my-zsh", tags: [zsh] }
  # fzf fuzzy finder; zsh/.zshrc loads its key bindings + completion via `fzf --zsh`
  - { via: brew, name: fzf, bin: fzf, tags: [core, zsh] }

  # claude code (native installer -> ~/.local/bin/claude; updates via `claude update`)
  - { via: script, name: claude, bin: claude, cmd: "curl -fsSL https://claude.ai/install.sh | bash", tags: [dev] }
  # github cli — `gh auth login` (pick SSH) registers this machine's key with GitHub
  - { via: brew, name: gh, bin: gh, tags: [dev, git] }

  # cli tools
  - { via: brew, name: zoxide,    bin: zoxide, tags: [core] }   # `z` smart cd; zsh/.zshrc inits it
  - { via: brew, name: git-delta, bin: delta,  tags: [git] }    # git pager; configured in git/.gitconfig
  - { via: brew, name: yazi,      bin: yazi,   tags: [cli] }    # file manager; `y` fn in zsh/.zshrc

  # google-chrome — per platform. macOS: cask. Linux (amd64 only; no arm64
  # build from Google): official .deb, which also wires up Google's apt repo
  # for future updates.
  - { via: cask,   name: google-chrome, only: [macos], tags: [app] }
  - { via: script, name: google-chrome, bin: google-chrome, only: [linux], tags: [app],
      cmd: "sudo apt-get update -qq && curl -fsSL -o /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -y /tmp/google-chrome.deb && rm -f /tmp/google-chrome.deb" }

  # Docker Desktop (macOS only; on WSL you use Docker Desktop on Windows).
  # Swap to 'orbstack' for a lighter, faster Docker Desktop replacement.
  - { via: cask, name: docker-desktop, only: [macos], tags: [app, dev] }

