# Colima default-profile config. The installer seeds this into
# ~/.colima/default/colima.yaml ONCE (only if absent); Colima manages the file
# after the first `colima start`, so edit it there (or re-seed by deleting it).
#
# Tune cpu/memory/disk per machine — these are reserved from macOS while the VM
# runs, so don't starve the host. (16 GB Mac: ~memory 4–6. 32 GB+: 8–12.)

cpu: 4
memory: 8          # GiB
disk: 100          # GiB — thin-provisioned (grows only), so set generously now

runtime: docker
vmType: vz         # Apple Virtualization framework (Apple Silicon) — faster than qemu
rosetta: true      # run x86_64/amd64 images on Apple Silicon
mountType: virtiofs # fast file sharing for mounted source (needs vmType: vz)
autoActivate: true # set this profile as the active docker context on start
